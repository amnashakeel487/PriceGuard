services:
  - type: web
    name: priceguard-backend
    runtime: python
    rootDir: priceguard-web/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: CHECK_INTERVAL_SECONDS
        value: "3600"
      - key: CORS_ORIGINS
        sync: false
